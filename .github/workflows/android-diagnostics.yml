name: Android diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Resolved versions
        working-directory: apps/mobile
        run: |
          node -e "for (const p of ['expo','expo-modules-core','expo-modules-autolinking','react-native','@react-native/gradle-plugin']) { try { console.log(p, require(require.resolve(p + '/package.json')).version) } catch (e) { console.log(p, 'ERR', e.message.split('\n')[0]) } }"
          echo '--- cli present?'
          ls node_modules/@react-native-community 2>/dev/null || echo 'no @react-native-community in apps/mobile'
          echo '--- npx cli version'
          npx --yes @react-native-community/cli --version || true
      - name: Expo react-native config
        working-directory: apps/mobile
        run: node -e "console.log(JSON.stringify(require('expo/react-native.config.js').dependency.platforms.android))"
      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive
      - name: Autolinking config as gradle sees it
        working-directory: apps/mobile
        run: |
          npx --yes @react-native-community/cli config > /tmp/autolinking.json 2>/tmp/autolinking.err || echo "cli exited non-zero"
          head -c 2000 /tmp/autolinking.err || true
          node -e "const d=require('/tmp/autolinking.json'); console.log('root', d.root); for (const [n,i] of Object.entries(d.dependencies||{})) { const a=(i.platforms||{}).android; if (a) console.log(n, '=>', a.packageImportPath, '|', a.packageInstance) }"
      - name: Generate autolinking package list
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:generateAutolinkingPackageList || true
      - name: Show generated package list
        run: |
          find apps/mobile/android -name 'PackageList.java' -o -name 'autolinking.json' | head -20
          sed -n '1,25p' apps/mobile/android/app/build/generated/autolinking/src/main/java/com/facebook/react/PackageList.java 2>/dev/null || echo 'PackageList.java not found'
          echo '--- settings.gradle'
          sed -n '1,45p' apps/mobile/android/settings.gradle
