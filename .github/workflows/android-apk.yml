name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["feat/bootstrap-foundation"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate native Android project
        run: pnpm --filter @faceless/mobile exec expo prebuild --platform android --no-install --non-interactive
      - name: Build installable Android APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 assembleDebug
      - name: Package APK as ZIP
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/Faceless-Shorts.apk
          test -s dist/Faceless-Shorts.apk
          cd dist
          zip -9 Faceless-Shorts-Android-APK.zip Faceless-Shorts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Faceless-Shorts-Android-APK
          path: |
            dist/Faceless-Shorts.apk
            dist/Faceless-Shorts-Android-APK.zip
          if-no-files-found: error
          retention-days: 30
