name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["feat/bootstrap-foundation"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify Expo asset dependency
        run: pnpm --filter @faceless/mobile exec node -e "require.resolve('expo-asset/package.json')"
      - name: Generate native Android project
        run: pnpm --filter @faceless/mobile exec expo prebuild --platform android --no-install --non-interactive
      - name: Build installable Android APK
        timeout-minutes: 25
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          chmod +x ./gradlew
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::EXPO_PUBLIC_API_URL is not set. The app will start in backend-setup mode; users can enter the reachable API origin on the login screen."
          else
            case "$EXPO_PUBLIC_API_URL" in
              https://*) ;;
              *) echo "::error::EXPO_PUBLIC_API_URL must use HTTPS."; exit 1 ;;
            esac
            case "$EXPO_PUBLIC_API_URL" in
              *example.com*) echo "::error::EXPO_PUBLIC_API_URL must not be a placeholder hostname."; exit 1 ;;
            esac
          fi
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 assembleRelease
      # The emulator smoke test used to boot an AVD here. GitHub's hosted runners have no KVM,
      # so x86_64 emulation runs without hardware acceleration and never finished booting
      # ("Timeout waiting for emulator to boot"). Re-add this step on a runner with /dev/kvm.
      - name: Verify the APK is a self-contained release build
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' \
            || { echo "::error::APK has no embedded JS bundle and would need Metro."; exit 1; }
          MAGIC="$(unzip -p "$APK" assets/index.android.bundle | head -c 4 | od -An -tx1 | tr -d ' \n')"
          test "$MAGIC" = "c61fbc03" \
            || { echo "::error::embedded bundle is not Hermes bytecode (magic $MAGIC)."; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.facelessshorts.engine'" "$RUNNER_TEMP/badging.txt" \
            || { echo "::error::unexpected Android package id."; exit 1; }
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then
            echo "::error::release APK is marked debuggable and expects a development server."; exit 1
          fi
          echo "static release checks passed: embedded Hermes bundle, release package, not debuggable"
      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Package APK as ZIP
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/Faceless-Shorts.apk
          test -s dist/Faceless-Shorts.apk
          unzip -l dist/Faceless-Shorts.apk | grep -q 'assets/index.android.bundle'
          cat > dist/README.txt <<'EOF'
          Faceless Shorts Engine - Android APK

          Installation:
          1. Transfer Faceless-Shorts.apk to your Android device.
          2. Open the APK and allow installation from this source if Android asks.
          3. Install and open the app.

          Backend:
          The APK requires a reachable HTTPS API configured at build time through
          the GitHub Actions repository variable EXPO_PUBLIC_API_URL.
          If that variable was empty during this build, the app opens in backend-setup
          mode. Enter the reachable HTTPS API origin on the login screen before signing in.

          This CI APK is signed with the workflow's Android release build key.
          It is intended for testing, not as a Play Store signing identity.
          EOF
          (cd dist && sha256sum Faceless-Shorts.apk > SHA256SUMS.txt)
          cd dist
          zip -9 Faceless-Shorts-Android-APK.zip Faceless-Shorts.apk README.txt SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Faceless-Shorts-Android-APK
          path: |
            dist/Faceless-Shorts.apk
            dist/Faceless-Shorts-Android-APK.zip
          if-no-files-found: error
          retention-days: 30
