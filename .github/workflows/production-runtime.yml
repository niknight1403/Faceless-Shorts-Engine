name: Production Runtime

on:
  pull_request:
    branches: ["feat/bootstrap-foundation", "main"]
    paths:
      - "apps/api/**"
      - "apps/workers/**"
      - "packages/**"
      - "prisma/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.production.example"
      - ".github/workflows/production-runtime.yml"
  push:
    branches: ["feat/bootstrap-foundation"]
    paths:
      - "apps/api/**"
      - "apps/workers/**"
      - "packages/**"
      - "prisma/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.production.example"
      - ".github/workflows/production-runtime.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated smoke-test environment
        run: cp .env.production.example .env
      - name: Configure deterministic E2E media routes
        shell: bash
        run: |
          set -euo pipefail
          api_token="$(openssl rand -hex 32)"
          asset_secret="$(openssl rand -hex 32)"
          sed -i "s|^API_ACCESS_TOKEN=.*|API_ACCESS_TOKEN=${api_token}|" .env
          sed -i "s|^ASSET_SIGNING_SECRET=.*|ASSET_SIGNING_SECRET=${asset_secret}|" .env
          cat >> .env <<'EOF'
          KOKORO_TTS_BASE_URL=http://mock-providers:4010
          KOKORO_TTS_VOICE=smoke-test
          VISUALS_BASE_URL=http://mock-providers:4010/prompt
          TTS_AI_ENABLED=false
          EOF
          echo "::add-mask::${api_token}"
          echo "API_ACCESS_TOKEN=${api_token}" >> "$GITHUB_ENV"
      - name: Build and start the production stack
        run: docker compose --profile e2e up --detach --build --wait --wait-timeout 240
      - name: Verify API liveness and dependency readiness
        run: |
          curl --fail --show-error --retry 10 --retry-delay 2 http://127.0.0.1:4000/health/live
          curl --fail --show-error --retry 10 --retry-delay 2 http://127.0.0.1:4000/health/ready
      - name: Verify provider status endpoint
        run: |
          curl --fail --show-error --retry 10 --retry-delay 2 http://127.0.0.1:4000/v1/providers | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              if (payload.freeOnly !== true) process.exit(1);
              for (const key of ["llm", "tts", "visuals"]) {
                if (!Array.isArray(payload[key])) process.exit(1);
              }
              if (!payload.tts.includes("kokoro-local")) process.exit(1);
              if (!payload.visuals.includes("pollinations-free")) process.exit(1);
            });
          '
      - name: Configure ephemeral E2E admin credentials and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          admin_email="runtime-${GITHUB_RUN_ID}@example.test"
          admin_password="$(openssl rand -base64 24 | tr -d '\\n')Aa1!"
          echo "::add-mask::${admin_password}"
          echo "BOOTSTRAP_ADMIN_EMAIL=${admin_email}" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=${admin_password}" >> "$GITHUB_ENV"
          docker compose exec -T \\
            -e BOOTSTRAP_ADMIN_EMAIL="${admin_email}" \\
            -e BOOTSTRAP_ADMIN_PASSWORD="${admin_password}" \\
            worker pnpm admin:bootstrap
      - name: Verify user login, session and admin authorization
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \\
            -H "content-type: application/json" \\
            -d "{\\"email\\":\\"${BOOTSTRAP_ADMIN_EMAIL}\\",\\"password\\":\\"${BOOTSTRAP_ADMIN_PASSWORD}\\"}" \\
            http://127.0.0.1:4000/v1/auth/login)"
          session_token="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s);if(!v.accessToken)process.exit(1);process.stdout.write(v.accessToken)})')"
          organization_id="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s);const o=v.organizations?.find(x=>x.role==="ADMIN");if(!o)process.exit(1);process.stdout.write(o.id)})')"
          echo "::add-mask::${session_token}"
          echo "SESSION_ACCESS_TOKEN=${session_token}" >> "$GITHUB_ENV"
          echo "ADMIN_ORGANIZATION_ID=${organization_id}" >> "$GITHUB_ENV"
          curl --fail --silent --show-error -H "authorization: Bearer ${session_token}" http://127.0.0.1:4000/v1/auth/me | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s);if(!v.user?.email||!v.organizations?.length)process.exit(1)})'
          curl --fail --silent --show-error -H "authorization: Bearer ${session_token}" -H "x-organization-id: ${organization_id}" http://127.0.0.1:4000/v1/admin/overview | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s);if(v.role!=="ADMIN"||!v.counts)process.exit(1)})'
      - name: Seed isolated E2E project
        id: seed
        shell: bash
        env:
          ADMIN_ORGANIZATION_ID: ${{ env.ADMIN_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          project_id="$(docker compose exec -T -e ADMIN_ORGANIZATION_ID="$ADMIN_ORGANIZATION_ID" worker node --input-type=module -e '
            import { PrismaClient } from "@prisma/client";
            const prisma = new PrismaClient();
            const organization = await prisma.organization.findUnique({ where: { id: process.env.ADMIN_ORGANIZATION_ID } });
            if (!organization) throw new Error("admin_organization_not_found");
            const project = await prisma.project.create({ data: { organizationId: organization.id, name: "Video pipeline smoke test" } });
            console.log(project.id);
            await prisma.$disconnect();
          ' | tail -n 1)"
          test -n "$project_id"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
      - name: Create video job through the API
        id: job
        env:
          PROJECT_ID: ${{ steps.seed.outputs.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "authorization: Bearer $API_ACCESS_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"projectId\":\"$PROJECT_ID\",\"topic\":\"Runtime pipeline verification\",\"language\":\"de\",\"targetDurationSeconds\":10,\"targetPlatforms\":[\"youtube_shorts\"],\"idempotencyKey\":\"runtime-e2e-$(date +%s)\"}" \
            http://127.0.0.1:4000/v1/video-jobs)"
          job_id="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const v=JSON.parse(s);if(!v.id)process.exit(1);console.log(v.id)})')"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
      - name: Wait for MP4 render and verify signed download
        env:
          JOB_ID: ${{ steps.job.outputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          job_url="http://127.0.0.1:4000/v1/video-jobs/$JOB_ID"
          status=""
          for attempt in $(seq 1 90); do
            payload="$(curl --fail --silent --show-error -H "authorization: Bearer $SESSION_ACCESS_TOKEN" "$job_url")"
            status="$(printf '%s' "$payload" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>console.log(JSON.parse(s).status))')"
            if [ "$status" = "COMPLETED" ]; then
              printf '%s' "$payload" > /tmp/runtime-e2e-job.json
              break
            fi
            if [ "$status" = "FAILED" ] && [ "$attempt" -gt 15 ]; then
              printf '%s\n' "$payload"
              echo "video_job_failed"
              exit 1
            fi
            sleep 2
          done
          test "$status" = "COMPLETED"
          download_url="$(node -e '
            const job = require("/tmp/runtime-e2e-job.json");
            const asset = job.assets.find(item => item.kind === "VIDEO" && item.mimeType === "video/mp4");
            if (!asset || !asset.downloadUrl) process.exit(1);
            process.stdout.write(asset.downloadUrl);
          ')"
          curl --fail --silent --show-error "http://127.0.0.1:4000$download_url" -o /tmp/runtime-e2e-final.mp4
          test "$(stat -c %s /tmp/runtime-e2e-final.mp4)" -gt 1024
          expected_sha="$(docker compose exec -T api sha256sum "/var/lib/faceless-shorts/media/$JOB_ID/final.mp4" | awk '{print $1}')"
          actual_sha="$(sha256sum /tmp/runtime-e2e-final.mp4 | awk '{print $1}')"
          test "$expected_sha" = "$actual_sha"
          curl --fail --silent --show-error -D /tmp/runtime-e2e-range.headers -H "Range: bytes=0-99" "http://127.0.0.1:4000$download_url" -o /tmp/runtime-e2e-range.bin
          grep -Eq '^HTTP/[^ ]+ 206' /tmp/runtime-e2e-range.headers
          test "$(stat -c %s /tmp/runtime-e2e-range.bin)" -eq 100
          docker compose exec -T api ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "/var/lib/faceless-shorts/media/$JOB_ID/final.mp4"
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop smoke-test stack
        if: always()
        run: docker compose --profile e2e down --volumes --remove-orphans
