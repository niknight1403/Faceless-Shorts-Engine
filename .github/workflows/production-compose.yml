name: Production Compose Validation

on:
  push:
    branches: ["feat/bootstrap-foundation"]
    paths:
      - "Dockerfile"
      - "docker-compose.production.yml"
      - ".env.production.example"
      - ".github/workflows/production-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.production.yml"
      - ".env.production.example"
      - ".github/workflows/production-compose.yml"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret validation environment
        run: cp .env.production.example .env.production
      - name: Validate production Compose model
        run: docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
