name: Secret configuration audit

on:
  workflow_dispatch:
  push:
    branches: ["feat/**", "main"]
    paths:
      - ".github/workflows/secret-audit.yml"
      - ".env.example"

permissions:
  contents: read

jobs:
  audit:
    name: Check provider secret availability
    runs-on: ubuntu-latest
    env:
      AGENTFORGE_HUB_TOKEN: ${{ secrets.AGENTFORGE_HUB_TOKEN }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      KOKORO_TTS_API_KEY: ${{ secrets.KOKORO_TTS_API_KEY }}
    steps:
      - name: Report presence only (never print values)
        shell: bash
        run: |
          set +x
          missing=0
          check_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              echo "SET     $name"
            else
              echo "MISSING $name"
              missing=$((missing + 1))
            fi
          }
          check_secret AGENTFORGE_HUB_TOKEN "$AGENTFORGE_HUB_TOKEN"
          check_secret CEREBRAS_API_KEY "$CEREBRAS_API_KEY"
          check_secret GROQ_API_KEY "$GROQ_API_KEY"
          check_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          check_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check_secret CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          check_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          check_secret KOKORO_TTS_API_KEY "$KOKORO_TTS_API_KEY"
          echo "Audit finished. Missing optional credentials: $missing"
          echo "No secret values were displayed or exported as artifacts."
