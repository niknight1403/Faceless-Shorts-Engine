name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://shorts:shorts@localhost:5432/shorts_engine?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
