name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://shorts:shorts@localhost:5432/shorts_engine?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm typecheck
